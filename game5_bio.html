      <div class="ingredient wrong draggable-item" data-kind="wrong" tabindex="0" style="right:9%;bottom:12%;"><span>🧴</span><span data-template-id="plastic-label" class="canva-text"></span>
      </div>
      <div class="ingredient wrong draggable-item" data-kind="wrong" tabindex="0" style="left:28%;top:50%;"><span>☣️</span><span data-template-id="chemical-label" class="canva-text"></span>
      </div>
      <div class="ingredient wrong draggable-item" data-kind="wrong" tabindex="0" style="right:28%;top:50%;"><span>🥩</span><span data-template-id="meat-label" class="canva-text"></span>
      </div>
      <div class="counter"><span id="compost-count">0</span>/3 <span data-template-id="compost-counter-label" class="canva-text"></span>
      </div>
      <div id="rejection-message" class="rejection" aria-live="polite"><span data-template-id="rejection-text" class="canva-text"></span>
      </div>
     </div>
    </div>
   </section>
   <section id="water-modal" class="modal-wrap" role="dialog" aria-modal="true" aria-labelledby="water-modal-title">
    <div class="modal">
     <div class="modal-icon">
      💧
     </div>
     <h2 id="water-modal-title" data-template-id="water-message-title" class="canva-text"></h2>
     <p data-template-id="water-message" class="canva-text"></p><button id="to-feed" data-template-id="water-next-button" class="canva-button action-btn" type="button"></button>
    </div>
   </section>
   <section id="compost-modal" class="modal-wrap" role="dialog" aria-modal="true" aria-labelledby="compost-modal-title">
    <div class="modal">
     <div class="modal-icon">
      🌱
     </div>
     <h2 id="compost-modal-title" data-template-id="compost-message-title" class="canva-text"></h2>
     <p data-template-id="compost-message" class="canva-text"></p><button id="show-final" data-template-id="complete-button" class="canva-button action-btn" type="button"></button>
    </div>
   </section>
   <section id="final-screen" class="final-screen" aria-labelledby="complete-title">
    <div data-template-id="final-card" class="canva-card final-card">
     <div class="reward-bottle" aria-hidden="true">
      🧪
     </div>
     <h1 id="complete-title" data-template-id="complete-title" class="canva-text font-extrabold"></h1>
     <p data-template-id="complete-copy" class="canva-text mx-auto max-w-md mt-3 mb-4"></p>
     <div data-template-id="reward-label" class="canva-banner inline-block rounded-2xl px-5 py-3 font-extrabold"></div>
     <div class="mt-7"><button id="restart-game" data-template-id="restart-button" class="canva-button action-btn" type="button"></button>
     </div>
    </div>
   </section>
  </main>
  <script src="/_sdk/0d3107a88dd31248.editing_sdk.js" integrity="sha512-YxJYPIC1TZ/l8asjpXojbfYA1LiLTr3Fh6BPE6fDLKLWTkDIhVGqsl6xMTuKf5GPOv3sZeQW9jrwgZcsiAARIQ=="></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();

      let pondCollected = 0, fedCount = 0, composted = 0, activeDrag = null, resultSaved = false;
      const stages = [document.getElementById("stage-1"), document.getElementById("stage-2"), document.getElementById("stage-3")];
      const dataHandler = { onDataChanged() {} };
      if (window.dataSdk) window.dataSdk.init(dataHandler);

      function showStage(stage) {
        stages.forEach(item => item.classList.remove("active"));
        stage.classList.add("active");
      }

      function dropItem(element, x, y) {
        const kind = element.dataset.kind;
        const zone = kind === "pond" ? document.getElementById("scoop-zone") : null;
        const zoneRect = zone ? zone.getBoundingClientRect() : null;
        const droppedInScoop = zoneRect && x >= zoneRect.left && x <= zoneRect.right && y >= zoneRect.top && y <= zoneRect.bottom;
        const target = document.elementFromPoint(x, y);
        const tray = document.getElementById("feeding-tray");
        const trayRect = tray.getBoundingClientRect();
        const droppedInTray = kind === "food" && x >= trayRect.left && x <= trayRect.right && y >= trayRect.top && y <= trayRect.bottom;
        const bin = document.getElementById("compost-bin");
        const binRect = bin.getBoundingClientRect();
        const droppedInBin = x >= binRect.left && x <= binRect.right && y >= binRect.top && y <= binRect.bottom;
        element.classList.remove("dragging");
        activeDrag = null;

        if (kind === "pond" && droppedInScoop && !element.classList.contains("collected")) {
          element.classList.add("collected");
          element.style.position = "";
          element.style.left = "";
          element.style.top = "";
          element.style.transform = "";
          pondCollected++;
          document.getElementById("pond-count").textContent = pondCollected;
          if (pondCollected === 6) {
            document.getElementById("water-status").classList.remove("hidden");
            setTimeout(() => document.getElementById("water-modal").classList.add("show"), 500);
          }
          return;
        }

        if (element._originalParent && element.parentElement !== element._originalParent) {
          element._originalParent.appendChild(element);
        }
        if (element.dataset.originalStyle) element.setAttribute("style", element.dataset.originalStyle);

        if (kind === "food" && droppedInTray && !element.classList.contains("fed")) {
          element.classList.add("fed");
          fedCount++;
          document.getElementById("food-count").textContent = fedCount;
          if (fedCount === 3) {
            document.getElementById("feed-status").classList.remove("hidden");
            document.getElementById("feed-next-area").classList.remove("hidden");
          }
        }
        if ((kind === "correct" || kind === "wrong") && droppedInBin) {
          if (kind === "correct" && !element.classList.contains("sorted")) {
            element.classList.add("sorted");
            composted++;
            document.getElementById("compost-count").textContent = composted;
            if (composted === 3) setTimeout(() => document.getElementById("compost-modal").classList.add("show"), 450);
          } else if (kind === "wrong") {
            const note = document.getElementById("rejection-message");
            note.classList.add("show");
            setTimeout(() => note.classList.remove("show"), 1600);
          }
        }
      }

      function beginDrag(element, event) {
        if (element.classList.contains("collected") || element.classList.contains("fed") || element.classList.contains("sorted")) return;
        activeDrag = element;
        element._originalParent = element.parentElement;
        element.dataset.originalStyle = element.getAttribute("style") || "";
        const rect = element.getBoundingClientRect();
        activeDrag.dataset.offsetX = event.clientX - rect.left;
        activeDrag.dataset.offsetY = event.clientY - rect.top;
        element.classList.add("dragging");
        // Keep the measured dimensions while moving out of the scaled scene.
        element.style.width = rect.width + "px";
        element.style.height = rect.height + "px";
        element.style.minHeight = rect.height + "px";
        element.style.position = "fixed";
        element.style.left = rect.left + "px";
        element.style.top = rect.top + "px";
        document.body.appendChild(element);
      }

      function moveDrag(event) {
        if (!activeDrag) return;
        event.preventDefault();
        activeDrag.style.left = (event.clientX - Number(activeDrag.dataset.offsetX)) + "px";
        activeDrag.style.top = (event.clientY - Number(activeDrag.dataset.offsetY)) + "px";
      }

      document.querySelectorAll(".draggable-item").forEach(element => {
        element.addEventListener("pointerdown", event => {
          event.preventDefault();
          beginDrag(element, event);
          element.setPointerCapture(event.pointerId);
        });
        element.addEventListener("pointermove", moveDrag);
        element.addEventListener("pointerup", event => {
          if (activeDrag === element) dropItem(element, event.clientX, event.clientY);
        });
        element.addEventListener("pointercancel", event => {
          if (activeDrag === element) dropItem(element, event.clientX, event.clientY);
        });
      });

      document.getElementById("to-feed").addEventListener("click", () => {
        document.getElementById("water-modal").classList.remove("show");
        showStage(stages[1]);
      });
      document.getElementById("to-compost").addEventListener("click", () => showStage(stages[2]));
      document.getElementById("show-final").addEventListener("click", async () => {
        document.getElementById("compost-modal").classList.remove("show");
        document.getElementById("final-screen").classList.add("show");
        if (!resultSaved && window.dataSdk) {
          resultSaved = true;
          await window.dataSdk.create({
            player_name: "ผู้เล่น",
            score: 100,
            stage1_completed: true,
            stage2_completed: true,
            stage3_completed: true,
            all_stages_completed: true,
            completed_at: new Date().toISOString()
          });
        }
      });
      document.getElementById("restart-game").addEventListener("click", () => {
        pondCollected = 0; fedCount = 0; composted = 0; resultSaved = false;
        document.getElementById("pond-count").textContent = "0";
        document.getElementById("food-count").textContent = "0";
        document.getElementById("compost-count").textContent = "0";
        document.querySelectorAll(".plant").forEach(el => el.classList.remove("collected"));
        document.querySelectorAll(".food").forEach(el => el.classList.remove("fed"));
        document.querySelectorAll(".ingredient").forEach(el => el.classList.remove("sorted"));
        document.getElementById("water-status").classList.add("hidden");
        document.getElementById("feed-status").classList.add("hidden");
        document.getElementById("feed-next-area").classList.add("hidden");
        document.getElementById("final-screen").classList.remove("show");
        showStage(stages[0]);
      });
    });
  </script>
 </body>
</html>
